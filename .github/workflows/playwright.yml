name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser(s) to run'
        required: false
        default: 'all'
        type: choice
        options: [all, chromium, firefox, webkit]
      suite:
        description: 'Test suite'
        required: false
        default: 'all'
        type: choice
        options: [all, login, cart]
      base_url:
        description: 'Base URL override'
        required: false
        default: 'https://www.demoblaze.com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        exclude:
          - browser: ${{ (github.event.inputs.browser != '' && github.event.inputs.browser != 'all') && (github.event.inputs.browser != 'chromium') && 'chromium' || 'none' }}
          - browser: ${{ (github.event.inputs.browser != '' && github.event.inputs.browser != 'all') && (github.event.inputs.browser != 'firefox')  && 'firefox'  || 'none' }}
          - browser: ${{ (github.event.inputs.browser != '' && github.event.inputs.browser != 'all') && (github.event.inputs.browser != 'webkit')   && 'webkit'   || 'none' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests — ${{ matrix.browser }} / suite=${{ github.event.inputs.suite || 'all' }}
        run: |
          GREP=""
          if [ "${{ github.event.inputs.suite }}" = "login" ]; then
            GREP="--grep TC-LOG"
          elif [ "${{ github.event.inputs.suite }}" = "cart" ]; then
            GREP="--grep TC-CRT"
          fi
          npx playwright test --project=${{ matrix.browser }} $GREP
        env:
          CI: true
          BASE_URL: ${{ github.event.inputs.base_url || 'https://www.demoblaze.com' }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

  allure-report:
    name: Publish Allure report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies (for allure-commandline)
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history into results
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload combined Allure report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report/
          retention-days: 14
