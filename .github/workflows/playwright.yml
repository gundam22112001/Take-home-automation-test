name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser(s) to run'
        required: false
        default: 'all'
        type: choice
        options: [all, chromium, firefox, webkit]
      suite:
        description: 'Test suite'
        required: false
        default: 'all'
        type: choice
        options: [all, login, cart]
      base_url:
        description: 'Base URL override'
        required: false
        default: 'https://www.demoblaze.com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        exclude:
          - browser: ${{ (github.event.inputs.browser != '' && github.event.inputs.browser != 'all') && (github.event.inputs.browser != 'chromium') && 'chromium' || 'none' }}
          - browser: ${{ (github.event.inputs.browser != '' && github.event.inputs.browser != 'all') && (github.event.inputs.browser != 'firefox')  && 'firefox'  || 'none' }}
          - browser: ${{ (github.event.inputs.browser != '' && github.event.inputs.browser != 'all') && (github.event.inputs.browser != 'webkit')   && 'webkit'   || 'none' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests — ${{ matrix.browser }} / suite=${{ github.event.inputs.suite || 'all' }}
        run: |
          GREP=""
          if [ "${{ github.event.inputs.suite }}" = "login" ]; then
            GREP="--grep TC-LOG"
          elif [ "${{ github.event.inputs.suite }}" = "cart" ]; then
            GREP="--grep TC-CRT"
          fi
          npx playwright test --project=${{ matrix.browser }} $GREP
        env:
          CI: true
          BASE_URL: ${{ github.event.inputs.base_url || 'https://www.demoblaze.com' }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Check Allure results were written
        if: always()
        run: |
          echo "=== allure-results contents ==="
          find allure-results -type f 2>/dev/null | head -20 || echo "allure-results directory is missing or empty"
          echo "JSON file count: $(find allure-results -name '*.json' 2>/dev/null | wc -l)"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

  allure-report:
    name: Publish Allure report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies (for allure-commandline)
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Check downloaded results
        run: |
          echo "=== merged allure-results ==="
          find allure-results -type f 2>/dev/null | head -30 || echo "allure-results is empty after download"
          echo "Total JSON files: $(find allure-results -name '*.json' 2>/dev/null | wc -l)"

      - name: Restore Allure history from gh-pages
        run: |
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- history 2>/dev/null || true
            if [ -d history ]; then
              cp -r history allure-results/history
              echo "Allure history restored."
            else
              echo "No history directory on gh-pages yet — starting fresh."
            fi
          else
            echo "gh-pages branch does not exist yet — starting fresh."
          fi

      - name: Generate Allure report
        run: |
          COUNT=$(find allure-results -name '*.json' 2>/dev/null | wc -l)
          echo "Generating report from $COUNT result files"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No Allure result files found — report will be empty"
          fi
          npx allure generate allure-results --clean -o allure-report

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload combined Allure report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report/
          retention-days: 14

      - name: Post Allure report link to job summary
        if: always()
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          TOTAL=$(find allure-report -name '*.json' -path '*/widgets/*' 2>/dev/null | head -1 | xargs grep -o '"total":[0-9]*' 2>/dev/null | grep -o '[0-9]*' || echo "?")
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📊 Allure Test Report

          | | |
          |---|---|
          | **Report** | [View on GitHub Pages]($PAGES_URL) |
          | **Run** | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Triggered by** | ${{ github.event_name }} |

          > Report is published on every merge to \`main\`. Artifact \`allure-report-combined\` is available for all runs.
          EOF
